name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Build with warnings as errors
        run: dotnet build SubscriptionLens.sln -c Release
      - name: Run core and network-contract tests
        run: dotnet run --project tests/SubscriptionLens.Tests/SubscriptionLens.Tests.csproj -c Release --no-build
      - name: Publish self-contained desktop executable
        run: dotnet publish src/SubscriptionLens.App/SubscriptionLens.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/publish
      - uses: actions/upload-artifact@v7
        with:
          name: SubscriptionLens-win-x64
          path: artifacts/publish/
