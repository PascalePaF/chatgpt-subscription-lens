name: Release Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        default: v1.1.0

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Resolve tag
        id: version
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Test before packaging
        run: npm run check

      - name: Build Windows NSIS installer
        run: npm run tauri build -- --bundles nsis

      - name: Create release archives and checksums
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $bundleDir = Join-Path $PWD "src-tauri\target\release\bundle\nsis"
          $source = Get-ChildItem -LiteralPath $bundleDir -Filter "*-setup.exe" -File | Select-Object -First 1
          if (-not $source) { throw "NSIS installer was not produced" }
          $installer = Join-Path $PWD "SubscriptionLens-v$version-windows-x64-setup.exe"
          Copy-Item -LiteralPath $source.FullName -Destination $installer
          $files = @($installer)
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -LiteralPath "SHA256SUMS.txt" -Encoding utf8NoBOM
          "installer=$installer" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "订阅镜 $tag" --notes-file RELEASE_NOTES.md
          }
          gh release upload $tag "${{ steps.package.outputs.installer }}" "SHA256SUMS.txt" --clobber
