name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Verify tag and build installer
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ((Get-Content VERSION -Raw).Trim() -ne $version) { throw 'Tag and VERSION differ.' }
          ./scripts/build-release.ps1 -Version $version
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          gh release create "v$version" `
            "release/SubscriptionLens-v$version-windows-x64-setup.exe" `
            "release/SubscriptionLens-v$version-windows-x64-setup.exe.sha256" `
            --title "订阅镜 v$version" `
            --generate-notes `
            --verify-tag
