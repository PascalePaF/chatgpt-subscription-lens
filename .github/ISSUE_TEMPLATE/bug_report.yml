name: 兼容性或界面问题
description: 报告脱敏后的查询、安装或界面问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **不要粘贴 Session、Token、Cookie、完整邮箱、账户 ID、银行卡或原始响应。**
        安全漏洞请使用仓库的私密安全报告功能。
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: 例如 1.0.1
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题范围
      options:
        - 安装 / 升级 / 卸载
        - 凭证本地检查
        - Session 远端核验
        - 订阅或套餐显示
        - Codex 额度
        - 支付方式或账单
        - 原生界面 / DPI / 无障碍
        - 其他
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 说明预期与实际行为；字段和值必须脱敏。
    validations:
      required: true
  - type: textarea
    id: sanitized
    attributes:
      label: 脱敏状态信息
      description: 只提供 HTTP 状态、缺失字段名和套餐类型；不要提供原始 JSON。
  - type: checkboxes
    id: safety
    attributes:
      label: 安全确认
      options:
        - label: 我确认以上内容不含任何 Session、Token、Cookie、完整邮箱、账户 ID、银行卡或账单隐私。
          required: true
