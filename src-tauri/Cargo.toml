[package]
name = "chatgpt-subscription-lens"
version = "1.0.1"
description = "Local, read-only ChatGPT subscription inspector"
authors = ["PascalePaF"]
license = "MIT"
repository = "https://github.com/PascalePaF/chatgpt-subscription-lens"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "chatgpt_subscription_lens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.8.5", features = [] }
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "time"] }
url = "2.5.7"
zeroize = "1.8.1"

[dev-dependencies]
pretty_assertions = "1.4.1"
