[package]
name = "chatgpt-subscription-lens"
version = "1.1.2"
description = "Native, local, read-only ChatGPT subscription inspector"
authors = ["PascalePaF"]
license = "MIT"
repository = "https://github.com/PascalePaF/chatgpt-subscription-lens"
edition = "2021"
rust-version = "1.92"

[lib]
name = "chatgpt_subscription_lens_lib"
crate-type = ["rlib"]

[build-dependencies]
winres = "0.1.12"

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
eframe = { version = "=0.35.0", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
image = { version = "=0.25.8", default-features = false, features = ["png"] }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "time"] }
url = "2.5.7"
zeroize = "1.8.1"

[dev-dependencies]
pretty_assertions = "1.4.1"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
